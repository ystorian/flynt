# .github/workflows/release.yaml

name: Release

on:
  push:
    tags:
      - v*
  # Allow manual run to test without signing or publishing anything.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel a release in flight.
  cancel-in-progress: false


jobs:

  release:
    name: Workflows
    uses: ystorian/workflows/.github/workflows/release_rust.yaml@46d10d829ac525544a499be7caf21927a957c4de # v1.10.0
    permissions:
      contents: write # Create and publish the release.
    secrets:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}


  crate:
    name: Workflows
    needs: release
    if: github.event_name == 'push'
    uses: ystorian/workflows/.github/workflows/publish_crate.yaml@46d10d829ac525544a499be7caf21927a957c4de # v1.10.0
    permissions:
      contents: read
      id-token: write # OpenID Connect token for crates.io Trusted Publishing.
