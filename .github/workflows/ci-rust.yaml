# .github/workflows/ci-rust.yaml

name: CI

on:
  schedule:
    # Runs every Monday at 06:00 UTC (Summer: 08:00, Winter: 07:00).
    - cron: 0 6 * * 1
  workflow_dispatch: # Allows manual triggering.
  push:
    # Run on push to branches, ignore push to tags.
    branches:
      - "**"
    tags:
      - "!**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  # Always display colored outputs.
  CARGO_TERM_COLOR: always

  # Reduce Cargo output.
  CARGO_TERM_QUIET: true

  # Disable incremental compilation for faster from-scratch builds.
  CARGO_INCREMENTAL: 0

  # Disable debug info to reduce the size of `./target`
  CARGO_PROFILE_TEST_DEBUG: 0

  # Optional minimum Rust toolchain version.
  # - empty: Use the runner's preinstalled toolchain and skip caching.
  # - set: Install and cache that version only when the runner has an older one.
  RUST_VERSION: "1.99"

  # Link with LLVM's lld-link on Windows, faster than the default linker.
  CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: lld-link.exe
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link.exe

  # Override the crt-static flag from `.cargo/config.toml`, this slows down CI runs.
  CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: ""
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: ""

  # Specific variables for this project.


jobs:

  changes:
    # Uses `dorny/paths-filter` with `.github/filters.yaml` to skip irrelevant jobs.
    name: Detect changes
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      ci: ${{ steps.filter.outputs.ci || 'true' }}
    steps:
      - name: Checkout the source
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect file changes based on filters.yaml
        if: github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: .github/filters.yaml


  check:
    name: Check - Linux arm64
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Rust formatting
        run: |
          cargo fmt --version
          cargo fmt --all --check

      - name: Check action versions with Pinact
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          verify: "true"
          verify_min_age: "true"
          min_age: "7"

      - name: Install cargo tools
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: |
            cargo-deny
            just@1.58.0
            zizmor

      - name: Check Just recipes
        run: just check_just

      - name: Check actions with Zizmor
        run: just audit_actions

      - name: Check Rust vulnerabilities with cargo-deny
        run: just deny


  test:
    name: Test - ${{matrix.name}}
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ${{matrix.os}}
    permissions:
      contents: read
    defaults:
      run:
        # Only for matrix using Windows.
        shell: bash

    strategy:
      matrix:
        include:
          - os: ubuntu-26.04-arm
            name: Linux arm64
          - os: windows-11-arm
            name: Windows arm64
          - os: macos-26
            name: macOS arm64

    steps:

      - name: Windows - Make it faster
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          fsutil behavior set disablelastaccess 1
          fsutil behavior set disable8dot3 1


      - name: Check the minimum Rust version ${{ env.RUST_VERSION }}
        id: toolchain
        run: |
          ver_newer() {
            local IFS=. a b i; set -f; a=($1) b=($2); set +f
            for i in 0 1 2; do
              [ "${a[i]:-0}" -gt "${b[i]:-0}" ] && return 0
              [ "${a[i]:-0}" -lt "${b[i]:-0}" ] && return 1
            done
            return 1
          }
          CURRENT="$(rustc --version | cut -d' ' -f2)"
          if [ -z "${RUST_VERSION}" ]; then
            echo "No minimum version, using the preinstalled version ${CURRENT}."
            echo "preinstalled=true" >> "$GITHUB_OUTPUT"
          elif ver_newer "${RUST_VERSION}" "${CURRENT}"; then
            echo "The preinstalled version ${CURRENT} is older than the minimum version \
              ${RUST_VERSION} - will install ${RUST_VERSION}."
            echo "preinstalled=false" >> "$GITHUB_OUTPUT"
          else
            echo "The preinstalled version ${CURRENT} meets the minimum version ${RUST_VERSION}."
            echo "preinstalled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the Rust toolchain
        if: steps.toolchain.outputs.preinstalled != 'true'
        run: rustup update --no-self-update ${RUST_VERSION}

      - name: Set the default Rust toolchain
        if: steps.toolchain.outputs.preinstalled != 'true'
        run: rustup default ${RUST_VERSION}

      - name: Linux - Add Clippy
        if: startsWith(matrix.os, 'ubuntu') && steps.toolchain.outputs.preinstalled != 'true'
        run: rustup component add clippy

      - name: Linux - Setup Mold
        if: startsWith(matrix.os, 'ubuntu')
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
        with:
          mold-version: 3.0.0

      - name: Checkout the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Define the Cargo cache keys
        id: keys
        env:
          LOCK_HASH: ${{ hashFiles('**/Cargo.lock') }}
        run: |
          echo "lock=$(echo "$LOCK_HASH" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "rustc=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache the Cargo crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # zizmor: ignore[cache-poisoning]
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          # The scheduled run gets a unique key and no `restore-keys` to always build from scratch
          # and save a fresh cache image.
          key: cargo-${{runner.os}}-${{runner.arch}}-${{ steps.keys.outputs.rustc }}-${{ steps.keys.outputs.lock }}${{ github.event_name == 'schedule' && format('-{0}', github.run_id) || '' }}
          restore-keys: ${{ github.event_name != 'schedule' && format('cargo-{0}-{1}-{2}-', runner.os, runner.arch, steps.keys.outputs.rustc) || '' }}

      - name: Download all dependencies
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo fetch --locked

      # The step "Check Rust formatting" (cargo fmt --all --check) is done by the `check` job.

      # All the next cargo commands are with `--frozen` (--locked and --offline)

      - name: Test
        run: cargo test --frozen --profile ci --all-features --workspace

      - name: Linux - Check and lint with Clippy
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo clippy --frozen --profile ci --all-features --workspace -- -D warnings

      - name: Prune the workspace artifacts before saving the cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: |
          crates="$(cargo metadata --frozen --no-deps --format-version 1 | \
            jq -r '.packages[].name')"
          for crate in ${crates}; do
            file="${crate//-/_}"
            rm -rf \
              "target/ci/.fingerprint/${crate}-"* \
              "target/ci/build/${crate}-"*
            rm -f \
              "target/ci/deps/${file}-"* \
              "target/ci/deps/lib${file}-"* \
              "target/ci/${crate}" \
              "target/ci/${crate}.d"
          done
          rm -rf \
            target/ci/incremental \
            target/ci/examples
          du -sh target/ci


  cache-cleanup:
    name: Cache cleanup
    needs: test
    if: github.ref == 'refs/heads/main'
    # This needs the `gh` CLI, not available on `ubuntu-slim`.
    runs-on: ubuntu-26.04-arm
    permissions:
      actions: write # Required to list and delete the cache entries of this repository.

    steps:
      - name: Delete the superseded Cargo caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}/actions/caches?per_page=100&ref=refs/heads/main" --paginate \
            --jq '.actions_caches[] | select(.key | startswith("cargo-")) | [.id, .key, .created_at] | @tsv' \
            | sort -k3 -r \
            | awk -F'\t' '{ split($2, f, "-"); g = f[1]"-"f[2]"-"f[3]"-"f[4]; if (seen[g]++) print $1, $2 }' \
            | while read -r id key; do
                echo "Deleting the superseded cache ${key}"
                gh api -X DELETE "repos/${REPO}/actions/caches/${id}"
              done


  # Set `Require status checks to pass` only to `Status check`.
  status:
    name: Status check
    needs: [changes, check, test]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Validate jobs status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "changes=$CHANGES_RESULT check=$CHECK_RESULT test=$TEST_RESULT"
          if [ "$CHANGES_RESULT" = "failure" ] || [ "$CHANGES_RESULT" = "cancelled" ] \
            || [ "$CHECK_RESULT" = "failure" ] || [ "$CHECK_RESULT" = "cancelled" ] \
            || [ "$TEST_RESULT" = "failure" ] || [ "$TEST_RESULT" = "cancelled" ]; then
            echo "::error::A required CI job failed or was cancelled."
            exit 1
          fi
          echo "All required CI jobs passed or were skipped."
