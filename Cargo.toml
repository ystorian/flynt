# Cargo.toml

[package]
name = "flynt"
version = "0.4.0"
edition = "2024"
# rust-version = "1.85"
description = "Fluent linter for Askama templates"
license = "MIT OR Apache-2.0"
authors = ["Flavien Scheurer <flavien+flynt@ystorian.com>"]
repository = "https://github.com/ystorian/flynt"
readme = "README.md"
keywords = ["fluent", "ftl", "i18n", "l10n", "linter", "askama"]
categories = ["development-tools", "internationalization", "command-line-utilities"]
publish = true
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "./README.md", "LICENSE-*"]

[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWQ69Hvl5QTvlEijVj07M01eDJYtEJuTvfBKDPQ/0VkiOX3vL9IlbCwX"

[lib]
name = "flynt"
path = "src/lib.rs"

[[bin]]
name = "flynt"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }
clap = { version = "4.6", default-features = false, features = [
	"std",
	"derive",
	"help",
	"usage",
	"error-context",
	"wrap_help",
] }
fluent-syntax = { version = "0.12", default-features = false }
glob = { version = "0.3", default-features = false }
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
walkdir = { version = "2.5", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
debug = "none"
panic = "abort"


# Profile for GitHub action, used by `.github/workflows/ci-rust.yaml`
[profile.ci]
inherits = "dev"
debug = false
incremental = false
opt-level = 0

[profile.ci.package."*"]
debug = false
incremental = false
opt-level = 0
