[package]
name = "flynt"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Lint Fluent translation keys against their use in Rust code and Askama templates"
license = "MIT OR Apache-2.0"
authors = ["Flavien Scheurer <flavien+flynt@ystorian.com>"]
repository = "https://github.com/ystorian/flynt"
readme = "README.md"
keywords = ["fluent", "i18n", "l10n", "lint", "askama"]
categories = ["development-tools", "internationalization", "command-line-utilities"]
publish = true
exclude = [
	".editorconfig",
	".gitignore",
	".github",
	".just",
	".markdownlint.json",
	".rustfmt.toml",
	".vscode",
	"deny.toml",
	"Icon*",
	"justfile",
]
